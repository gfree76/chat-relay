name: Deploy

# On merge to main: build + push the image to GHCR, then deploy to the Hetzner
# box (the same host running Authentik) over SSH via docker compose.
#
# workflow_dispatch adds a manual "Run workflow" button (and `gh workflow run
# deploy.yml`) for redeploying a chosen ref without a push event.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
    steps:
      - name: Check deploy secrets
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          for v in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS DEPLOY_DIR; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required deploy secrets: ${missing[*]}" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 compose.yaml "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/compose.yaml.new"
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_DIR' && mv compose.yaml.new compose.yaml && docker compose pull chat-relay && docker compose up -d chat-relay && docker image prune -f"

      - name: Verify deployed image
        env:
          EXPECTED: ${{ needs.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          running=$(ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_DIR' && docker inspect \$(docker compose ps -q chat-relay) --format '{{index .RepoDigests 0}}'")
          running=${running##*@}
          echo "expected: $EXPECTED"
          echo "running:  $running"
          [ "$running" = "$EXPECTED" ] || { echo "MISMATCH: box is not running the image just built"; exit 1; }

      - name: Health check
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:8080/healthz"
          echo " <- healthz OK"
