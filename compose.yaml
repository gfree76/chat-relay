# Deployment unit for the Hetzner box (alongside Authentik).
#
# The box terminates TLS with nginx + certbot on a public IP. The relay
# publishes to loopback and nginx reverse-proxies its hostname to it.
# See deploy/README.md.

services:
  chat-relay:
    image: ghcr.io/gfree76/chat-relay:latest # tag is rewritten by the deploy workflow
    container_name: chat-relay
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      STORE_PATH: /data/devices.db
      FCM_PROJECT_ID: org-gfree76-chat
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/fcm-sa.json

    # The image runs as uid 65532, which must own ./data and be able to read
    # ./secrets/fcm-sa.json on the host. The relay refuses to start without the
    # key; create_host_path: false makes compose fail instead of mounting an
    # empty directory in its place.
    volumes:
      - ./data:/data
      - type: bind
        source: ./secrets/fcm-sa.json
        target: /run/secrets/fcm-sa.json
        read_only: true
        bind:
          create_host_path: false

    # Loopback only — nginx is the sole public entrance. Binding 0.0.0.0 here
    # would expose the relay directly on the box's public IP, bypassing TLS.
    ports:
      - "127.0.0.1:8080:8080"

    # No healthcheck on purpose: the runtime is distroless (no shell, no curl)
    # and the binary has no self-probe flag, so there is nothing honest to run
    # here yet. restart: unless-stopped covers crashes. If compose-level health
    # becomes useful, add a -healthcheck flag to main.go that GETs /healthz.
