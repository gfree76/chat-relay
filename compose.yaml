# Deployment unit for the Hetzner box (alongside Authentik).
# The reverse-proxy wiring below is a TEMPLATE — uncomment/adjust for whatever
# proxy the box already runs (Authentik embedded proxy, Traefik, nginx, Caddy).
# The relay must be reachable by the phones over HTTPS at a stable hostname
# (e.g. relay.itsalwaysreefreemas.org).

services:
  chat-relay:
    image: ghcr.io/gfree76/chat_relay:latest # set by the deploy workflow
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      # FCM_PROJECT_ID: your-firebase-project-id
      # GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/fcm-sa.json
    healthcheck:
      test: ["CMD", "/chat-relay", "--help"] # replace with a curl/wget healthz if the image gains one
      interval: 30s
      timeout: 3s
      retries: 3

    # --- Option A: Traefik (labels) ---
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.chat-relay.rule=Host(`relay.itsalwaysreefreemas.org`)"
    #   - "traefik.http.routers.chat-relay.entrypoints=websecure"
    #   - "traefik.http.routers.chat-relay.tls.certresolver=le"
    #   - "traefik.http.services.chat-relay.loadbalancer.server.port=8080"

    # --- Option B: behind nginx/Caddy or Authentik proxy: publish to loopback only ---
    # ports:
    #   - "127.0.0.1:8080:8080"

    # networks:
    #   - proxy   # join the same network as your reverse proxy

