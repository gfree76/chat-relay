# nginx vhost for the chat relay on the Hetzner box.
#
# Install as /etc/nginx/sites-available/chat-relay and symlink into
# sites-enabled. This file is HTTP-only on purpose: run certbot --nginx
# afterwards and it rewrites this in place, adding the 443 server block,
# the certificate paths, and the 80 -> 443 redirect. Hand-writing the TLS
# block first just gives certbot something to fight with.

server {
    listen 80;
    listen [::]:80;
    server_name chat-relay.itsalwaysreefreemas.org;

    # Phones send small JSON bodies; cap it well below anything interesting.
    client_max_body_size 64k;

    access_log /var/log/nginx/chat-relay.access.log;
    error_log  /var/log/nginx/chat-relay.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
